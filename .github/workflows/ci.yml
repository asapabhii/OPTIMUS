name: CI — Lint, Type-check, Test, Belief-purity

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  # ─────────────────────────────────────────────────────
  # Backend: lint, type-check, unit tests
  # ─────────────────────────────────────────────────────
  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy core/ engine/ libs/ connectors/ services/api/ --ignore-missing-imports

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backend-quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: optimus
          POSTGRES_PASSWORD: optimus_test
          POSTGRES_DB: optimus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run migrations
        env:
          DATABASE_URL_SYNC: postgresql://optimus:optimus_test@localhost:5432/optimus_test
        run: uv run alembic upgrade head

      - name: Unit tests
        env:
          DATABASE_URL: postgresql+asyncpg://optimus:optimus_test@localhost:5432/optimus_test
          DATABASE_URL_SYNC: postgresql://optimus:optimus_test@localhost:5432/optimus_test
          APP_ENV: test
        run: uv run pytest tests/unit/ -v --tb=short --cov=core --cov=engine --cov=libs

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  # ─────────────────────────────────────────────────────
  # Release-blocker: Belief-purity suite
  # From Gate 2 onward, this is a permanent CI blocker.
  # ─────────────────────────────────────────────────────
  belief-purity:
    name: "🚫 Belief-purity Suite (release blocker)"
    runs-on: ubuntu-latest
    needs: backend-quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Anti-smuggling static check
        run: |
          uv run python -c "
          import ast, sys, pathlib
          # Static check: 'prior' or 'previous_belief' must NEVER appear
          # in the synthesize function signature or body
          belief_dir = pathlib.Path('engine/belief')
          violations = []
          for f in belief_dir.rglob('*.py'):
              tree = ast.parse(f.read_text())
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      if node.name == 'synthesize':
                          for arg in node.args.args:
                              if 'prior' in arg.arg or 'previous' in arg.arg:
                                  violations.append(f'{f}:{node.lineno} — synthesize() takes {arg.arg}')
          if violations:
              print('BELIEF-PURITY VIOLATION: prior conclusion reachable during recomputation')
              for v in violations:
                  print(f'  {v}')
              sys.exit(1)
          print('✓ Anti-smuggling check passed: synthesize() has no access to prior conclusions')
          "

      - name: Belief-purity tests
        run: uv run pytest tests/suites/belief_purity/ -v --tb=long -m belief_purity
        env:
          APP_ENV: test

  # ─────────────────────────────────────────────────────
  # Release-blocker: ER regression metric
  # Tracked over time against the labeled corpus.
  # ─────────────────────────────────────────────────────
  er-regression:
    name: "🚫 ER Regression (>=0.98 precision)"
    runs-on: ubuntu-latest
    needs: backend-quality
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: optimus
          POSTGRES_PASSWORD: optimus_test
          POSTGRES_DB: optimus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --all-extras

      - name: ER precision test against labeled corpus
        env:
          DATABASE_URL: postgresql+asyncpg://optimus:optimus_test@localhost:5432/optimus_test
          SENZING_LICENSE_KEY: ${{ secrets.SENZING_LICENSE_KEY }}
          APP_ENV: test
        run: uv run pytest tests/suites/er_regression/ -v --tb=long -m er_regression

  # ─────────────────────────────────────────────────────
  # Frontend: lint, type-check, build
  # ─────────────────────────────────────────────────────
  frontend:
    name: Frontend Quality + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Build
        run: npm run build

  # ─────────────────────────────────────────────────────
  # Integration tests (on develop/main only)
  # ─────────────────────────────────────────────────────
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: optimus
          POSTGRES_PASSWORD: optimus_test
          POSTGRES_DB: optimus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run migrations
        env:
          DATABASE_URL_SYNC: postgresql://optimus:optimus_test@localhost:5432/optimus_test
        run: uv run alembic upgrade head

      - name: Gate integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://optimus:optimus_test@localhost:5432/optimus_test
          DATABASE_URL_SYNC: postgresql://optimus:optimus_test@localhost:5432/optimus_test
          APP_ENV: test
        run: uv run pytest tests/integration/ -v --tb=long
