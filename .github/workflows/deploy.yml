name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate-check:
    name: Gate Check
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI passed
        run: echo "CI passed. Railway and Vercel auto-deploy from main branch."
