version: "3.9"

# Local development environment
# Mirrors the production architecture: separate services for Plane A, Plane B, and invalidation

services:
  # ─────────────────────────────────────────────────────
  # Infrastructure (local replacements for managed vendors)
  # ─────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: optimus
      POSTGRES_PASSWORD: optimus_dev
      POSTGRES_DB: optimus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optimus"]
      interval: 5s
      timeout: 5s
      retries: 5

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.1
    command:
      - redpanda start
      - --smp 1
      - --memory 256M
      - --mode dev-container
      - --default-log-level=warn
    ports:
      - "9092:9092"
      - "8081:8081"   # Schema registry
      - "8082:8082"   # Pandaproxy
      - "9644:9644"   # Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "6333:6333"
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.25
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=optimus
      - POSTGRES_PWD=optimus_dev
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  temporal-ui:
    image: temporalio/ui:2.31.2
    ports:
      - "8233:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      temporal:
        condition: service_healthy

  # ─────────────────────────────────────────────────────
  # Application services (mirror production deploy shape)
  # ─────────────────────────────────────────────────────

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+asyncpg://optimus:optimus_dev@postgres:5432/optimus
      - DATABASE_URL_SYNC=postgresql://optimus:optimus_dev@postgres:5432/optimus
      - REDPANDA_BROKERS=redpanda:9092
      - REDPANDA_SECURITY_PROTOCOL=PLAINTEXT
      - QDRANT_URL=http://qdrant:6333
      - TEMPORAL_ENDPOINT=temporal:7233
      - APP_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  plane-a:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.plane-a
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+asyncpg://optimus:optimus_dev@postgres:5432/optimus
      - DATABASE_URL_SYNC=postgresql://optimus:optimus_dev@postgres:5432/optimus
      - REDPANDA_BROKERS=redpanda:9092
      - REDPANDA_SECURITY_PROTOCOL=PLAINTEXT
      - QDRANT_URL=http://qdrant:6333
      - TEMPORAL_ENDPOINT=temporal:7233
      - APP_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      temporal:
        condition: service_healthy

  invalidation:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.invalidation
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+asyncpg://optimus:optimus_dev@postgres:5432/optimus
      - REDPANDA_BROKERS=redpanda:9092
      - REDPANDA_SECURITY_PROTOCOL=PLAINTEXT
      - APP_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

volumes:
  postgres_data:
  redpanda_data:
  qdrant_data:
